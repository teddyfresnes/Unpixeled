<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<title>Mini Verse 2025</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="css/main.css" rel="stylesheet">
</head>
<body class="vh-100 d-flex align-items-center justify-content-center">

	<div id="menu" class="glass p-5 rounded-5 shadow-lg text-center" style="max-width:400px;width:100%">
		<h1 class="display-5 fw-bold text-light mb-4">Mini Verse 2025</h1>

		<div id="forms">
			<div class="form-floating mb-3">
				<input id="login-user" class="form-control bg-dark text-light border-0" placeholder="Pseudo">
				<label for="login-user" class="text-secondary">Pseudo</label>
			</div>
			<div class="form-floating mb-4">
				<input id="login-pass" type="password" class="form-control bg-dark text-light border-0" placeholder="Mot de passe">
				<label for="login-pass" class="text-secondary">Mot de passe</label>
			</div>
			<button id="login-btn" class="btn btn-primary w-100 mb-2">Connexion</button>
			<button id="reg-btn"   class="btn btn-outline-light w-100 mb-3">Inscription</button>
		</div>

		<div id="join-section" style="display:none">
			<button id="join-btn"   class="btn btn-success w-100 mb-3">Rejoindre le monde</button>
			<button id="logout-btn" class="btn btn-outline-danger w-100">Se déconnecter</button>
		</div>

		<p id="msg" class="small text-warning mt-3"></p>
	</div>

	<div id="game-container" class="d-none"></div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
	<script src="/socket.io/socket.io.js"></script>
	<script type="module" src="js/main.js"></script>
</body>
</html>
